[package]
name = "app"
version = "0.1.4"
description = "Ghostwriter desktop app"
authors = ["Christian Karren"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "io-util"] }

uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
slug = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

keyring = { version = "3", features = ["apple-native"] }
